<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="/static/main.css">

</head>
<body>
<div class="container">
<div class="center">  <h1>ABC Hospital</h1></div>
<div style="text-align: right;">
    &nbsp<input type="text" name="searchtext"> 
    | 
    <input type="button" value="Search">&nbsp;
</div><br>

<div class="center-main">
<h3 style="justify-content: center; color: blue;">Admin Dashboard  </h3>


<div class="section-label"><caption style="color;">Registered Doctors</caption></div>
<table class="doctor" border="1" style="border-collapse: collapse; align-items: center;">
<tr><td>Doctor Name: </td><td><input type="button" value="edit"></td><td><input type="button" value="delete"></td></tr>
<tr><td>Doctor Name: </td><td><input type="button" value="edit"></td><td><input type="button" value="delete"></td></tr>
</table>

    <!--border="3-->
<div class="section-label"><caption style="color;">Registered Patients</caption></div>
<table class="patient" border="1" style="border-collapse: collapse; align-items: center;">
<tr><td>Patient Name: </td><td><input type="button" value="edit"></td><td><input type="button" value="delete"></td></tr>
<tr><td>Patient Name: </td><td><input type="button" value="edit"></td><td><input type="button" value="delete"></td></tr>
</table>

<div class="section-label"><caption style="color;">Upcoming Appointments</caption></div>
<table class="patient" border="1" style="border-collapse: collapse; align-items: center;">

<tr><td>Patient</td><td>Doctor</td><td>Specialization</td><td>Action</td></tr>

{% for d in app_data %}

<tr><td>{{d.pname}}</td><td>{{d.pname}}</td><td>{{d.spz}}</td><td><input type="button" value="view"></td></tr>

{% endfor %}

</table>




</div>
<div class="center" style="text-align: center; justify-content: center;">Copy rights reserved to ABC Hospital</div>

</div>

</html>
